name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,nlp,viz]"
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check src tests
      - name: Remove generated data before offline tests
        run: rm -rf data
      - name: Tests
        env:
          COLUMNS: "160"
          TERMINAL_WIDTH: "160"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -m "not integration and not slow" -q

      - name: Offline end-to-end demo from clean data
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          rm -rf data
          fbpipe demo
